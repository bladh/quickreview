name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to release (e.g. v0.1.0). Leave empty to use the pushed tag."
        required: false
        default: ""

permissions:
  contents: write

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Install Linux Fyne dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc libgl1-mesa-dev xorg-dev

      - name: Test
        run: go test ./...

  build:
    name: Build (${{ matrix.artifact }})
    needs: test
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            goos: linux
            goarch: amd64
            artifact: quickreview-linux-amd64
            binary: quickreview
            packaged: quickreview-linux-amd64
          - os: windows-latest
            goos: windows
            goarch: amd64
            artifact: quickreview-windows-amd64
            binary: quickreview.exe
            packaged: quickreview-windows-amd64.exe
          - os: macos-13
            goos: darwin
            goarch: amd64
            artifact: quickreview-darwin-amd64
            binary: quickreview
            packaged: quickreview-darwin-amd64
          - os: macos-latest
            goos: darwin
            goarch: arm64
            artifact: quickreview-darwin-arm64
            binary: quickreview
            packaged: quickreview-darwin-arm64

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc libgl1-mesa-dev xorg-dev zip

      - name: Version metadata
        id: meta
        shell: bash
        run: |
          if [[ -n "${{ github.event.inputs.tag }}" ]]; then
            VERSION="${{ github.event.inputs.tag }}"
          elif [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            VERSION="${GITHUB_REF_NAME}"
          else
            VERSION="dev-${GITHUB_SHA::7}"
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "1"
        run: >
          go build -trimpath
          -ldflags="-s -w -X main.version=${{ steps.meta.outputs.version }}"
          -o "${{ matrix.binary }}" .

      - name: Package artifact
        shell: bash
        run: |
          mkdir -p dist
          cp "${{ matrix.binary }}" "dist/${{ matrix.packaged }}"
          if [[ "${{ matrix.goos }}" != "windows" ]]; then
            chmod +x "dist/${{ matrix.packaged }}"
          fi
          cp README.md dist/
          (
            cd dist
            if [[ "${{ runner.os }}" == "Windows" ]]; then
              7z a "../${{ matrix.artifact }}.zip" .
            else
              zip -r "../${{ matrix.artifact }}.zip" .
            fi
          )

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact }}.zip
          if-no-files-found: error

  publish:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4

      - name: Resolve tag
        id: tag
        shell: bash
        run: |
          if [[ -n "${{ github.event.inputs.tag }}" ]]; then
            echo "name=${{ github.event.inputs.tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "name=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          fi

      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: false

      - name: Flatten release assets
        shell: bash
        run: |
          mkdir -p upload
          find release-assets -type f -name '*.zip' -exec cp {} upload/ \;
          ls -la upload

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.name }}
          name: QuickReview ${{ steps.tag.outputs.name }}
          generate_release_notes: true
          files: upload/*.zip
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
